plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// --- Firma di release (#78) ---------------------------------------------
// I valori arrivano da android/key.properties oppure dalle variabili
// d'ambiente (campo per campo, key.properties ha la precedenza).
// Mai stampare i valori: nei messaggi compaiono solo i NOMI mancanti.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def signingValue = { String propKey, String envKey ->
    def v = keystoreProperties.getProperty(propKey)
    if (v == null || v.trim().isEmpty()) {
        v = System.getenv(envKey)
    }
    return (v == null || v.trim().isEmpty()) ? null : v
}

def signingStoreFile = signingValue('storeFile', 'ANDROID_KEYSTORE_FILE')
def signingStorePassword = signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
def signingKeyPassword = signingValue('keyPassword', 'ANDROID_KEY_PASSWORD')

def releaseSigningMissing = []
if (signingStoreFile == null) releaseSigningMissing << 'storeFile (ANDROID_KEYSTORE_FILE)'
if (signingStorePassword == null) releaseSigningMissing << 'storePassword (ANDROID_KEYSTORE_PASSWORD)'
if (signingKeyAlias == null) releaseSigningMissing << 'keyAlias (ANDROID_KEY_ALIAS)'
if (signingKeyPassword == null) releaseSigningMissing << 'keyPassword (ANDROID_KEY_PASSWORD)'
if (signingStoreFile != null && !file(signingStoreFile).exists()) {
    releaseSigningMissing << "storeFile: file non trovato (${signingStoreFile})"
}
def releaseSigningReady = releaseSigningMissing.isEmpty()

android {
    namespace = "com.ecologicaleaving.fin"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.ecologicaleaving.fin"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    flavorDimensions = ["environment"]

    productFlavors {
        production {
            dimension = "environment"
            applicationId = "com.ecologicaleaving.fin"
            manifestPlaceholders = [appName: "Fin"]
        }

        dev {
            dimension = "environment"
            applicationId = "com.ecologicaleaving.fin.dev"
            manifestPlaceholders = [appName: "Fin Dev"]
            versionNameSuffix = "-dev"
        }
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile = file(signingStoreFile)
                storePassword = signingStorePassword
                keyAlias = signingKeyAlias
                keyPassword = signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Il ripiego sulla chiave di debug serve SOLO alla release del
            // flavor dev (build_and_install.ps1, build_dev.sh). La release
            // production e' bloccata da verifyProductionReleaseSigning.
            signingConfig = releaseSigningReady ? signingConfigs.release : signingConfigs.debug
        }
    }
}

// Guardia: la release di produzione non viene mai firmata con la chiave di debug.
def verifyProductionReleaseSigning = tasks.register('verifyProductionReleaseSigning') {
    doLast {
        if (!releaseSigningReady) {
            throw new GradleException(
                "La build di produzione richiede la chiave di release e NON viene firmata con la chiave di debug.\n" +
                "Mancano: ${releaseSigningMissing.join(', ')}.\n" +
                "Configura android/key.properties (vedi android/key.properties.example) " +
                "oppure le variabili d'ambiente ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, " +
                "ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD.")
        }
    }
}
tasks.matching { it.name == 'preProductionReleaseBuild' }.configureEach {
    dependsOn verifyProductionReleaseSigning
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.work:work-runtime-ktx:2.9.0"
}
