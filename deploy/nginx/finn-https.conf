# Install after the certificate exists. Cloudflare SSL/TLS must use Full (strict).
server {
    listen 80;
    listen [::]:80;
    server_name finn.8020solutions.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://finn.8020solutions.org$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finn.8020solutions.org;

    ssl_certificate /etc/letsencrypt/live/finn.8020solutions.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/finn.8020solutions.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FINNSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/finn.access.log;
    error_log /var/log/nginx/finn.error.log;

    include /etc/nginx/snippets/finn-static.conf;
}
