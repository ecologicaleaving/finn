# Initial HTTP-only site, used before requesting the origin TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name finn.8020solutions.org;

    access_log /var/log/nginx/finn.access.log;
    error_log /var/log/nginx/finn.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Publish the app only after origin HTTPS is configured.
    location / {
        return 404;
    }
}
