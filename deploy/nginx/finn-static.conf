# Include inside a server block. The global http block includes mime.types.
root /var/www/finn/current;
index index.html;
etag on;

# Build filenames are stable across releases. Flutter's service worker handles
# offline caching; HTTP caches must revalidate index, bootstrap, main and worker.
add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
add_header X-Content-Type-Options "nosniff" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

# Explicit module/SQLite MIME types, including on older distro mime.types files.
location ~ \.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
}

location ~ \.wasm$ {
    types { application/wasm wasm; }
    try_files $uri =404;
}

# Hosting metadata is excluded from Flutter's offline resource manifest.
location ~ ^/(?:_headers|_redirects|\.assetsignore)$ {
    return 404;
}

location = /.env {
    return 404;
}

# Missing assets must be 404, rather than index.html with a misleading MIME type.
# The intentionally public Flutter asset /assets/.env remains available.
location ~* \.(?:js|json|css|png|jpe?g|webp|gif|svg|ico|woff2?|ttf|otf|map|pdf|bcmap|bin|txt)$ {
    try_files $uri =404;
}

location / {
    try_files $uri $uri/ /index.html;
}
